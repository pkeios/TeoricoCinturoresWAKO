<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Kickboxing – Exámenes de cinturón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f12;--card:#1a1a20;--card2:#23232b;--line:#2e2e38;--tx:#f2f2f5;--mut:#9a9aa8;--ok:#2ecc71;--bad:#ff4d4d;--acc:#e63946;--belt:#F5C518}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1,h2,.bebas{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.5px;font-weight:400}
h1{font-size:40px;line-height:1}
h2{font-size:28px}
.sub{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.belt{background:var(--belt);border-color:var(--belt);color:#111}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}
.glove{width:44px;height:44px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Bebas Neue';font-size:28px;font-weight:400;line-height:1}
.stat span{font-size:12px;color:var(--mut)}
.belts{display:flex;flex-direction:column;gap:12px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.bcard .stripe{height:10px;background:var(--c)}
.bcard .in{padding:14px 16px}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bname{font-family:'Bebas Neue';font-size:30px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.prog{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--c);border-radius:9px}
.locked{opacity:.45}
.lockmsg{font-size:13px;color:var(--mut)}
.best{text-align:right;font-size:12px;color:var(--mut)}
.best b{display:block;font-family:'Bebas Neue';font-size:26px;font-weight:400;color:var(--tx);line-height:1}
.bcard .row .btn{padding:10px}
.bcard .btn.belt{background:var(--c);border-color:var(--c);color:var(--fg)}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtop .x{width:38px;height:38px;border-radius:10px;background:var(--card2);font-size:18px}
.qbar{flex:1;height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--belt);transition:width .3s}
.qcount{font-size:13px;color:var(--mut);min-width:44px;text-align:right}
.meta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--mut)}
.streak{color:#ffb020;font-weight:700}
.timer{height:5px;background:var(--card2);border-radius:9px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--ok);width:100%}
.timer.warn i{background:var(--bad)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qtag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:6px;background:var(--belt);color:#111;margin-bottom:10px}
.qtype{font-size:12px;color:var(--mut);margin-left:6px}
.qtext{font-size:19px;font-weight:600;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;background:var(--card2);border:2px solid var(--line);font-weight:500;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:#555}
.opt.sel{border-color:var(--belt);background:#2b2b20}
.opt.ok{border-color:var(--ok);background:rgba(46,204,113,.15)}
.opt.bad{border-color:var(--bad);background:rgba(255,77,77,.13)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
.inp{width:100%;padding:14px;border-radius:12px;background:var(--card2);border:2px solid var(--line);color:var(--tx);font:inherit;font-size:18px}
.inp:focus{outline:none;border-color:var(--belt)}
.inp.ok{border-color:var(--ok)}.inp.bad{border-color:var(--bad)}
.order-ans{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.order-pool{display:flex;flex-wrap:wrap;gap:8px}
.och{padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.order-ans .och{background:#2b2b20;border-color:var(--belt)}
.och .n{color:var(--belt);margin-right:5px;font-size:12px}
.actions{margin-top:14px;display:flex;gap:10px}
.actions .btn{flex:1}
.fb{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);animation:pop .25s}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb h3{font-size:16px;margin-bottom:4px}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb p{font-size:14px;color:#d4d4dc}
.fb .ans{font-weight:700;color:var(--tx)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
/* results */
.res{text-align:center;padding:10px 0 4px}
.ring{width:170px;height:170px;margin:10px auto 6px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bebas Neue';font-size:56px;line-height:1}
.ring .v small{display:block;font-size:14px;color:var(--mut);font-family:Inter}
.verdict{font-family:'Bebas Neue';font-size:34px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.mlist{margin-top:18px;display:flex;flex-direction:column;gap:10px;text-align:left}
.mitem{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px}
.mitem .q{font-weight:600;font-size:14px;margin-bottom:4px}
.mitem .a{font-size:14px;color:var(--ok)}
.mitem .y{font-size:13px;color:var(--bad)}
.mitem .e{font-size:13px;color:var(--mut);margin-top:4px}
.unlock{margin:14px 0;padding:14px;border-radius:14px;background:var(--c);color:var(--fg);font-weight:700;animation:pop .4s}
/* flash */
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flash .q{font-size:20px;font-weight:600}
.flash .a{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:17px;color:var(--ok);font-weight:600}
.flash .e{font-size:14px;color:var(--mut);margin-top:8px;font-weight:400}
.flash .tap{margin-top:18px;font-size:13px;color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:20px}
summary{cursor:pointer;font-weight:600}
details ul{margin:10px 0 0 18px;font-size:14px;color:#cfcfd8}
details li{margin-bottom:6px}
.foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.foot .btn{font-size:13px;padding:9px 12px;flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px;z-index:9}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
.modal p{margin:8px 0 16px;color:#ccc;font-size:15px}
.hidden{display:none!important}
.kgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kg{min-width:46px;text-align:center;padding:7px 8px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-family:'Bebas Neue';font-size:22px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{padding:10px 6px;font-size:14px}
.trick{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(255,190,40,.08);border:1px solid rgba(255,190,40,.35);text-align:left}
.trick b{color:#ffc94a;font-size:14px}
.trick p{font-size:14px;color:#e6e6ec;margin-top:4px}
.flash .trick{cursor:default}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.pk{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.pn{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px}
.pv{margin-top:5px;font-weight:600}
.pv.blur{color:var(--mut);font-weight:400;font-style:italic}
.cmp{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.crow{display:grid;grid-template-columns:12px 72px 1fr;gap:8px;align-items:start;font-size:14px;padding:6px;border-radius:8px}
.crow.me{background:var(--card2);outline:1px solid var(--belt)}
.cdot{width:12px;height:12px;border-radius:3px;margin-top:4px}
.beltpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bp{padding:11px 6px;border-radius:12px;font-weight:700;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c)}
.bp.on{background:var(--c);color:var(--fg);border-color:var(--c)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
/* ============ CINTURONES ============ */
const BELTS=[
 {k:'am',n:'Amarillo',c:'#F5C518',fg:'#111',pass:60,nq:10,time:40,hint:true,inputP:0,   opts:3},
 {k:'na',n:'Naranja', c:'#F07A1A',fg:'#111',pass:60,nq:12,time:32,hint:true,inputP:0, opts:4},
 {k:'vi',n:'Violeta', c:'#9B4DE0',fg:'#fff',pass:60,nq:14,time:27,hint:true,inputP:0, opts:4},
 {k:'ve',n:'Verde',   c:'#2DB34A',fg:'#fff',pass:60,nq:16,time:23,hint:false,inputP:0,opts:5},
 {k:'az',n:'Azul',    c:'#2F6FE0',fg:'#fff',pass:70,nq:18,time:19,hint:false,inputP:0,opts:5},
 {k:'ma',n:'Marrón',  c:'#9A6332',fg:'#fff',pass:80,nq:20,time:16,hint:false,inputP:0,opts:5},
];

/* ============ BANCO DE PREGUNTAS ============ */
const Q=[];let CUR='am';
const belt=k=>{CUR=k};
function add(o){o.b=CUR;o.id=CUR+(Q.filter(x=>x.b===CUR).length+1);Q.push(o)}
const mc=(q,a,d,e,inp)=>add({t:'mc',q,a,d,e,inp});
const ms=(q,a,d,e)=>add({t:'ms',q,a,d,e});
const tf=(q,a,e)=>add({t:'tf',q,a,e});
const od=(q,a,e)=>add({t:'od',q,a,e});

/* ---- AMARILLO ---- */
belt('am');
mc('¿Qué significa Kickboxing?','Boxeo y patada',['Boxeo con rodillas','Combate de pie','Boxeo tailandés','Patada y puño libre'],'Kick = patada · Boxing = boxeo.',['boxeo y patada','patada y boxeo','boxeo patada']);
mc('¿Cuántas modalidades de TATAMI abarca el Kickboxing?','4',['3','5','6','2'],'Formas Musicales, Point Fighting, Light Contact y Kicklight.',['4','cuatro']);
mc('¿Cuántas modalidades de RING abarca el Kickboxing?','3',['4','2','5','6'],'Full Contact, Low Kick y K1 Style.',['3','tres']);
ms('Marcá TODAS las modalidades de TATAMI',['Formas Musicales','Point Fighting','Light Contact','Kicklight'],['Full Contact','Low Kick','K1 Style'],'Tatami: Formas Musicales, Point Fighting, Light Contact y Kicklight.');
ms('Marcá TODAS las modalidades de RING',['Full Contact','Low Kick','K1 Style'],['Kicklight','Light Contact','Point Fighting','Formas Musicales'],'Ring: Full Contact, Low Kick y K1 Style.');
tf('Kicklight es una modalidad de ring.',false,'Kicklight se compite en tatami.');
tf('Formas Musicales es una modalidad de tatami.',true,'Es una de las 4 modalidades de tatami.');
mc('¿Qué significa Full Contact?','Contacto pleno',['Contacto ligero','Contacto total con rodillas','Combate completo','Contacto libre'],'Full Contact = contacto pleno.',['contacto pleno']);
mc('¿Qué significa Light Contact?','Contacto ligero',['Contacto pleno','Contacto de piernas','Contacto por puntos','Contacto medio'],'Light Contact = contacto ligero.',['contacto ligero','contacto liviano']);
mc('¿Dónde se originó el Full Contact?','Los Ángeles, California',['Tokio, Japón','Bangkok, Tailandia','Miami, Florida','París, Francia'],'En Los Ángeles, California, el 14 de septiembre de 1974.',['los angeles','los angeles california','california']);
mc('¿Cuál es la fecha de origen del Full Contact?','14 de septiembre de 1974',['2 de abril de 1963','14 de septiembre de 1947','30 de noviembre de 1974','20 de julio de 1974'],'14/09/1974 en Los Ángeles. Ojo: 2/4/1963 es la palabra “Kickboxing”.');
mc('¿En qué AÑO se originó el Full Contact?','1974',['1963','1984','1971','1979'],'14 de septiembre de 1974.',['1974']);
mc('En Light Contact, ¿a qué porcentaje se reduce la potencia?','70%',['50%','60%','80%','30%'],'Técnicamente igual al Full Contact, pero en tatami y con la potencia al 70%.',['70','70%','70 por ciento']);
mc('En Full Contact, las técnicas de MANOS son similares a...','El boxeo',['El karate','El muay thai','El taekwondo','El kung fu'],'Manos: similar al boxeo.',['boxeo','el boxeo','box']);
mc('En Full Contact, las técnicas de PIERNAS son...','Una recopilación de todas las artes marciales: solo las patadas más efectivas',['Solo las patadas del taekwondo','Las del muay thai, con rodillas y codos','Solo patadas por debajo de la cintura'],'Se toman las patadas más efectivas de todas las artes marciales.');
mc('¿Dónde se compite el Full Contact?','Arriba de un ring',['En un tatami','En una jaula','En tatami o ring indistintamente'],'Full Contact es modalidad de ring.',['ring','en un ring','arriba de un ring']);
mc('¿En qué se diferencia el Light Contact del Full Contact?','Se compite en tatami y la potencia se reduce al 70%',['Solo se usan las manos','No hay patadas a la cabeza','Se compite en ring sin cabezal'],'Técnicamente es igual al Full Contact.');
mc('¿Cómo se llama un competidor de Full Contact?','Fullcontactista',['Kickboxer profesional','Ringuero','Fullcontacter'],'Full Contact → Fullcontactista.',['fullcontactista']);
mc('¿Cómo se llama un practicante de Light Contact?','Lightcontactista',['Lightboxer','Tatamista','Lightcontacter'],'Light Contact → Lightcontactista.',['lightcontactista']);
mc('¿A qué federación pertenecés?','Federación Argentina de Kickboxing',['Confederación Argentina de Deportes','Confederación Panamericana de Kickboxing','Asociación Argentina de Kickboxing'],'A la Federación Argentina de Kickboxing.',['federacion argentina de kickboxing','fak']);
mc('Cinturón Amarillo · Golpe de mano evaluado:','Uno y Dos',['Cross con ambas manos','Recto y revés','Swing','Hook'],'Uno y Dos, en el lugar, avanzando y retrocediendo.');
mc('Cinturón Amarillo · Golpe de pierna evaluado:','Patada frontal',['Patada circular','Patada lateral','Patada descendente','Patada en gancho'],'Patada frontal (en el lugar, avanzando y retrocediendo).');
mc('Cinturón Amarillo · Defensa de mano:','Bloqueo de los golpes Uno y Dos',['Absorción del Cross','Esquive del Swing','Absorción del revés'],'Bloqueo de Uno y Dos en el lugar, 2 veces cada técnica.');
mc('Cinturón Amarillo · Defensa de pierna:','Bloqueo de la patada frontal',['Absorción de la patada circular','Bloqueo de la patada descendente','Absorción de la patada lateral'],'Bloqueo de la patada frontal en el lugar.');
mc('Guardia de Light Contact · ¿qué desplazamientos se evalúan?','Dos pasos adelante, dos atrás y dos hacia los costados',['Un paso en cada dirección','Tres pasos adelante y tres atrás','Solo pasos laterales rebotando'],'Dos pasos en cada dirección.');
mc('En el examen, ¿cuántas veces se aplica cada técnica de defensa?','2 veces',['1 vez','3 veces','5 veces'],'Se aplica 2 veces la técnica C/U.',['2','dos','2 veces']);
mc('Cinturón Amarillo · Combate:','Light Contact 2 minutos',['Kicklight 2 minutos','1 round LC + 1 round KL','Point Fighting 2 minutos'],'Encadenamiento y combate: Light Contact 2 minutos.');
mc('Puntaje mínimo de aprobación (Amarillo a Verde):','60 puntos, mínimo 6 en cada punto',['70 puntos, mínimo 7 en cada punto','50 puntos','80 puntos'],'60/100 con 6 mínimo por punto. Azul y Marrón piden 70.');

/* ---- NARANJA ---- */
belt('na');
mc('¿Con cuántos fallos se puede definir un combate de Light Contact y Kicklight?','7',['5','6','8','4'],'Puntos, descalificación, RSC, RSCH, abandono, diferencia de 15 puntos en 2 jueces y ausencia.',['7','siete']);
ms('Marcá los fallos válidos en Light Contact y Kicklight',['Por puntos','Descalificación','Detención RSC','RSCH','Abandono','Diferencia de 15 puntos en 2 jueces','Ausencia'],['K.O.','K.O.T.'],'En tatami no está reglamentado el K.O. (knock out, dejar al rival fuera de combate): eso es de ring.');
mc('En los fallos, ¿qué significa RSC?','El árbitro detiene el combate (detención técnica)',['El árbitro detiene por golpes en la cabeza','Retiro sin combate','Descalificación por reincidencia'],'RSC = Referee Stops Contest: el árbitro detiene el combate. RSC-H agrega la H de Head (cabeza).');
mc('En los fallos, ¿qué significa RSCH?','El árbitro detiene por golpes en la cabeza (lesión, con control médico)',['El árbitro detiene por superioridad técnica','Abandono del rincón','Ausencia del competidor'],'RSC-H = Referee Stops Contest – Head: se detiene por golpes en la cabeza y el competidor pasa por control médico. En la planilla figura como “lesión-médico”.');
mc('Fallo por diferencia de puntos en LC y Kicklight:','15 puntos en 2 jueces',['10 puntos en 3 jueces','15 puntos en 1 juez','20 puntos en 2 jueces','10 puntos en 2 jueces'],'Diferencia de 15 puntos en 2 jueces.',['15','15 puntos']);
mc('Indumentaria de Kicklight:','Pantalón corto estilo Low Kick sin letras tailandesas y remera sin mangas estilo sudadera',['Chaqueta escote en V y pantalón largo','Torso desnudo y pantalón largo','Remera cuello redondo y pantalón largo'],'Short estilo Low Kick (sin letras tailandesas) + musculosa.');
ms('Protecciones de un practicante de Kicklight',['Vendas','Bucal','Cabezal','Pechera femenina','Protector inguinal','Canillera','Protector de pie'],['Coderas','Protector facial','Guantes de point fighting'],'Vendas, bucal, cabezal, pechera femenina, inguinal, canillera y protector de pie.');
tf('El pantalón de Kicklight puede tener letras tailandesas.',false,'Debe ser sin letras tailandesas.');
mc('¿Cómo se llama un practicante de Kickboxing?','Kickboxer',['Kickboxista','Boxeador','Pateador'],'Kickboxer.',['kickboxer']);
mc('Cinturón Naranja · Golpe de mano:','Cross con ambas manos',['Uno y Dos','Swing con ambas manos','Hook al mentón','Recto y revés'],'Cross con ambas manos en el lugar.');
mc('Cinturón Naranja · Golpe de pierna:','Patada circular',['Patada frontal','Patada en gancho','Patada lateral','Patada descendente'],'Patada circular (en el lugar, avanzando y retrocediendo).');
mc('Cinturón Naranja · Defensa de mano:','Bloqueo y absorción del Cross',['Bloqueo de Uno y Dos','Esquive del Swing','Absorción del revés'],'Bloqueo y absorción del Cross, 2 veces cada técnica.');
mc('Cinturón Naranja · Defensa de pierna:','Absorción de la patada circular',['Bloqueo de la patada frontal','Absorción de la patada lateral','Bloqueo de la patada en gancho'],'Absorción de la patada circular en el lugar.');
mc('Cinturón Naranja · Sombra:','Todas las técnicas de Kicklight durante 2 minutos',['De Full Contact','De Light Contact','De Low Kick'],'Sombra de Kicklight 2 minutos.');
mc('Cinturón Naranja · Combate:','1 round Light Contact + 1 round Kicklight',['Light Contact 2 minutos','1 round solo manos + 1 solo piernas','4 rounds de distintas modalidades'],'LC + KL, de 2 minutos cada uno.');
mc('Cinturón Naranja · ¿Qué patada se pregunta cómo bloquear (punto 9)?','Low kick',['Patada frontal','Patada descendente','Patada giro lateral'],'“Cómo se bloquea la patada low kick”.',['low kick','lowkick']);

/* ---- VIOLETA ---- */
belt('vi');

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().trim().replace(/^(el|la|los|las|un|una)\s+/,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\bkg\b|%|por ciento/g,'').replace(/[^a-z0-9+]/g,'');
function weighted(list,n){const pool=list.slice(),out=[];while(out.length<n&&pool.length){const w=pool.map(q=>6-box(q.id)),t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t,i=0;for(;i<pool.length;i++){r-=w[i];if(r<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0])}return out}
function ansText(q){if(q.t==='tf')return q.a?'Verdadero':'Falso';if(q.t==='ms')return q.a.join(' · ');if(q.t==='od')return q.a.join(' → ');return q.a}

let G=null;const T={iv:null};
function buildItem(q,b){
 const it={q,mode:q.t};
 if(q.t==='mc'){
  if(q.inp&&Math.random()<b.inputP)it.mode='in';
  else it.opts=shuffle([q.a,...shuffle(q.d).slice(0,b.opts-1)]);
 }
 if(q.t==='ms'){const extra=Math.min(q.d.length,1+Math.ceil(b.opts/2));it.opts=shuffle([...q.a,...shuffle(q.d).slice(0,extra)])}
 if(q.t==='od')it.opts=shuffle(q.a.map((x,i)=>i));
 return it;
}
function startQuiz(bi,review,kind){
 kind=kind||'t';const isP=kind==='p';const b0=BELTS[bi];setBelt(bi);
 const b=b0;let items;
 if(review){items=review.map(q=>buildItem(q,b))}
 else{
  const own=Q.filter(q=>q.b===b.k&&q.p===isP),prev=Q.filter(q=>q.p===isP&&BELTS.findIndex(x=>x.k===q.b)<bi);
  const nq=Math.min(b.nq,own.length+prev.length);
  const nOwn=bi===0?nq:Math.min(own.length,Math.round(nq*(isP?.6:.55)));
  let sel=[...weighted(own,nOwn),...weighted(prev,nq-nOwn)];
  if(sel.length<nq)sel=sel.concat(weighted(own.filter(q=>!sel.includes(q)),nq-sel.length));
  items=shuffle(sel).map(q=>buildItem(q,b));
 }
 G={bi,b,kind,items,i:0,pts:0,streak:0,maxStreak:0,wrong:[],review:!!review};
 renderQ();
}
function renderQ(){
 const {b,items,i}=G,it=items[i],q=it.q;
 it.sel=it.mode==='od'?[]:new Set();it.hinted=false;it.done=false;
 const qb=BELTS.find(x=>x.k===q.b);
 const typeLbl={mc:'Opción múltiple',ms:'Marcá todas las correctas',tf:'Verdadero o falso',od:'Ordená',in:'Escribí la respuesta'}[it.mode];
 let body='';
 if(it.mode==='mc'||it.mode==='ms')body=`<div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pick(${k})">${esc(o)}</button>`).join('')}</div>`;
 if(it.mode==='tf')body=`<div class="row"><button class="opt" data-k="1" onclick="pick(1)" style="text-align:center">✓ Verdadero</button><button class="opt" data-k="0" onclick="pick(0)" style="text-align:center">✗ Falso</button></div>`;
 if(it.mode==='in')body=`<input class="inp" id="inp" autocomplete="off" placeholder="Tu respuesta…" onkeydown="if(event.key==='Enter')check()">`;
 if(it.mode==='od')body=`<div class="order-ans" id="oans"></div><div class="order-pool" id="opool"></div>`;
 const needCheck=it.mode==='ms'||it.mode==='in'||it.mode==='od';
 app.innerHTML=`
 <div class="qtop"><button class="x" onclick="quitQ()">✕</button><div class="qbar"><i style="width:${i/items.length*100}%"></i></div><div class="qcount">${i+1}/${items.length}</div></div>
 <div class="meta"><span>${G.review?'Repaso de errores':(G.kind==='p'?'Técnico · ':'Teórico · ')+'Cinturón '+b.n}</span><span class="streak">${G.streak>=2?'🔥 '+G.streak+' seguidas':''}</span></div>
 ${G.review||!timed(it)?'':`<div class="timer" id="tm"><i id="tmi"></i></div>`}
 <div class="qcard" id="qc">
  <span class="qtag" style="background:${qb.c};color:${qb.fg}">${qb.n}</span><span class="qtype">${typeLbl}${!G.review&&!timed(it)?' · ⏱ sin límite':''}</span>
  <div class="qtext">${esc(q.q)}</div>${body}
  <div class="actions" id="acts">
   ${b.hint&&!G.review?`<button class="btn" id="hintb" onclick="hint()">💡 Pista (½ punto)</button>`:''}
   ${needCheck?`<button class="btn belt" id="chk" onclick="check()">Comprobar</button>`:''}
  </div>
  <div id="fb"></div>
 </div>`;
 if(it.mode==='od')drawOrder();
 if(it.mode==='in')setTimeout(()=>$('#inp')&&$('#inp').focus(),50);
 if(!G.review&&timed(it))startTimer();
}
function timed(it){return it.mode!=='ms'&&it.mode!=='od'}
function startTimer(){
 clearInterval(T.iv);const it=G.items[G.i];const dur=G.b.time*1000*(it.mode==='in'?2:1),t0=Date.now();
 T.iv=setInterval(()=>{const left=dur-(Date.now()-t0),p=Math.max(0,left/dur*100);const el=$('#tmi');if(!el){clearInterval(T.iv);return}
  el.style.width=p+'%';$('#tm').classList.toggle('warn',p<30);
  if(left<=0){clearInterval(T.iv);finish(false,true)}},100);
}
function drawOrder(){
 const it=G.items[G.i],q=it.q;
 $('#oans').innerHTML=it.sel.map((k,n)=>`<button class="och" onclick="unOrd(${n})"><span class="n">${n+1}</span>${esc(q.a[k])}</button>`).join('')||'<span class="sub" style="padding:8px">Tocá los elementos en orden…</span>';
 $('#opool').innerHTML=it.opts.filter(k=>!it.sel.includes(k)).map(k=>`<button class="och" onclick="ord(${k})">${esc(q.a[k])}</button>`).join('');
}
function ord(k){const it=G.items[G.i];if(it.done)return;it.sel.push(k);drawOrder()}
function unOrd(n){const it=G.items[G.i];if(it.done)return;it.sel.splice(n,1);drawOrder()}
function pick(k){
 const it=G.items[G.i];if(it.done)return;
 if(it.mode==='mc'){finish(it.opts[k]===it.q.a,false,k)}
 else if(it.mode==='tf'){finish((k===1)===it.q.a,false,k)}
 else if(it.mode==='ms'){const el=document.querySelector(`.opt[data-k="${k}"]`);if(el.classList.contains('gone'))return;it.sel.has(k)?it.sel.delete(k):it.sel.add(k);el.classList.toggle('sel')}
}
function check(){
 const it=G.items[G.i],q=it.q;if(it.done)return;
 if(it.mode==='ms'){if(!it.sel.size)return shake();const chosen=[...it.sel].map(k=>it.opts[k]);finish(chosen.length===q.a.length&&chosen.every(x=>q.a.includes(x)))}
 if(it.mode==='in'){const v=$('#inp').value.trim();if(!v)return shake();const acc=[q.a,...(q.inp||[])].map(norm);it.typed=v;finish(acc.includes(norm(v)))}
 if(it.mode==='od'){if(it.sel.length<q.a.length)return shake();finish(it.sel.every((k,n)=>k===n))}
}
function shake(){const c=$('#qc');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function hint(){
 const it=G.items[G.i],q=it.q;if(it.done||it.hinted)return;it.hinted=true;$('#hintb').disabled=true;
 if(it.mode==='mc'){const w=it.opts.map((o,k)=>k).filter(k=>it.opts[k]!==q.a&&!document.querySelector(`.opt[data-k="${k}"]`).classList.contains('gone'));const k=w[Math.random()*w.length|0];const el=document.querySelector(`.opt[data-k="${k}"]`);el.classList.add('gone');el.disabled=true}
 else if(it.mode==='ms'){const k=it.opts.findIndex(o=>!q.a.includes(o));if(k>=0){const el=document.querySelector(`.opt[data-k="${k}"]`);el.classList.add('gone');el.disabled=true;it.sel.delete(k);el.classList.remove('sel')}toast(`Hay ${q.a.length} correctas.`)}
 else if(it.mode==='tf'){toast('Pensá en la explicación de la planilla: ¿la frase dice todo exactamente igual?')}
 else if(it.mode==='in'){toast(`Empieza con “${String(q.a).slice(0,2)}…” y tiene ${String(q.a).length} caracteres.`)}
 else if(it.mode==='od'){it.sel=[0];drawOrder();toast('Te ubiqué el primero.')}
}
function toast(t){$('#fb').innerHTML=`<div class="fb"><p>💡 ${esc(t)}</p></div>`}
function finish(ok,timeout,k){
 clearInterval(T.iv);const it=G.items[G.i],q=it.q;it.done=true;it.ok=ok;
 const val=ok?(it.hinted?.5:1):0;G.pts+=val;
 if(ok){G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak)}else{G.streak=0;G.wrong.push(it)}
 setBox(q.id,ok&&!it.hinted);S.answered++;if(ok)S.correct++;save();
 // marcar opciones
 if(it.mode==='mc')document.querySelectorAll('.opt').forEach(el=>{const kk=+el.dataset.k;el.disabled=true;if(it.opts[kk]===q.a)el.classList.add('ok');else if(kk===k)el.classList.add('bad')});
 if(it.mode==='tf')document.querySelectorAll('.opt').forEach(el=>{const kk=+el.dataset.k;el.disabled=true;if((kk===1)===q.a)el.classList.add('ok');else if(kk===k)el.classList.add('bad')});
 if(it.mode==='ms')document.querySelectorAll('.opt').forEach(el=>{const kk=+el.dataset.k,o=it.opts[kk],good=q.a.includes(o),s=it.sel.has(kk);el.disabled=true;el.classList.remove('sel');if(good&&s)el.classList.add('ok');else if(!good&&s)el.classList.add('bad');else if(good)el.classList.add('miss')});
 if(it.mode==='in'){const e=$('#inp');e.disabled=true;e.classList.add(ok?'ok':'bad')}
 if(it.mode==='od')it.yours=it.sel.map(k=>q.a[k]);
 const hb=$('#hintb');if(hb)hb.remove();const ck=$('#chk');if(ck)ck.remove();
 const last=G.i===G.items.length-1;
 const title=timeout?'⏱ ¡Se acabó el tiempo!':ok?(it.hinted?'✓ Correcto (½ punto por la pista)':['✓ ¡Correcto!','✓ ¡Bien ahí!','✓ ¡Exacto!','✓ ¡Golpe limpio!'][Math.random()*4|0]):'✗ Incorrecto';
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${title}</h3>${ok?'':`<p>Respuesta: <span class="ans">${esc(ansText(q))}</span></p>`}<p>${esc(q.e||'')}</p></div>${trickHtml(q)}`;
 $('#acts').innerHTML=`<button class="btn belt full" id="nx" onclick="next()">${last?'Ver resultado':'Siguiente →'}</button>`;
 if(!ok)shake();
 setTimeout(()=>{const n=$('#nx');n&&n.focus()},50);
}
function next(){G.i++;if(G.i>=G.items.length)results();else renderQ()}
function quitQ(){clearInterval(T.iv);modal(`<h2>¿Abandonar?</h2><p>Se pierde este examen (el progreso de repetición espaciada se mantiene).</p><div class="row"><button class="btn" onclick="closeModal();${G&&!G.review&&timed(G.items[G.i])?'startTimer()':''}">Seguir</button><button class="btn pri" onclick="closeModal();home()">Salir</button></div>`)}

/* ============ RESULTADOS ============ */
function results(){
 const {b,bi,items,pts,wrong}=G,score=Math.round(pts/items.length*100),pass=score>=b.pass;
 let unlockHtml='';
 if(!G.review){S.sessions++;const bk=G.kind==='p'?b.k+'_p':b.k;if(S.best[bk]==null||score>S.best[bk])S.best[bk]=score;
  if(pass)unlockHtml=`<div class="unlock" style="--c:${b.c};--fg:${b.fg}">🥋 ${G.kind==='p'?'¡Tenés el programa práctico de '+b.n+' en la cabeza!':'¡Estás listo para el teórico de '+b.n+'!'}</div>`;
  save();}
 const C=2*Math.PI*72,col=G.review?'var(--belt)':pass?'var(--ok)':'var(--bad)';
 app.innerHTML=`
 <div class="res">
  <div class="sub">${G.review?'Repaso de errores':(G.kind==='p'?'Técnico':'Examen teórico')+' · Cinturón '+b.n}</div>
  <div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="72" stroke="#2a2a33" stroke-width="12" fill="none"/><circle cx="85" cy="85" r="72" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="arc" style="transition:stroke-dashoffset 1s ease"/></svg><div class="v"><div>${score}<small>/ 100</small></div></div></div>
  ${G.review?`<div class="verdict">${wrong.length?'Seguí repasando':'¡Todo corregido!'}</div>`:`<div class="verdict ${pass?'ok':'bad'}">${pass?'Aprobado':'Desaprobado'}</div><div class="sub">Necesitás ${b.pass} para aprobar · racha máx. ${G.maxStreak}</div>`}
  ${unlockHtml}
 </div>
 <div class="row" style="margin-top:16px">
  <button class="btn belt" onclick="startQuiz(${bi},null,'${G.kind}')">↻ Rendir de nuevo</button>
  ${wrong.length?`<button class="btn" onclick="startQuiz(${bi},G.wrong.map(w=>w.q),'${G.kind}')">Repasar ${wrong.length} error${wrong.length>1?'es':''}</button>`:''}
 </div>
 <button class="btn full" style="margin-top:10px" onclick="home()">Volver a los cinturones</button>
 ${wrong.length?`<h2 style="margin-top:22px">Tus errores</h2><div class="mlist">${wrong.map(w=>`<div class="mitem"><div class="q">${esc(w.q.q)}</div>${w.typed?`<div class="y">Escribiste: ${esc(w.typed)}</div>`:''}${w.yours?`<div class="y">Tu orden: ${esc(w.yours.join(' → '))}</div>`:''}<div class="a">✓ ${esc(ansText(w.q))}</div><div class="e">${esc(w.q.e||'')}</div>${trickHtml(w.q)}</div>`).join('')}</div>`:''}`;
 requestAnimationFrame(()=>setTimeout(()=>{const a=$('#arc');a&&(a.style.strokeDashoffset=C*(1-score/100))},60));
}

/* ============ MEMO TÉCNICO ============ */
let M={hide:false,rev:{},done:{}};
function memo(bi){
 clearInterval(T.iv);setBelt(bi);const b=BELTS[bi],P=PROG[b.k],np=Q.filter(q=>q.p&&BELTS.findIndex(x=>x.k===q.b)<=bi).length,best=S.best[b.k+'_p'];
 app.innerHTML=`
 <div class="qtop"><button class="x" onclick="M.done={};home()">←</button><div style="flex:1"><div class="sub" style="font-size:12px">Técnico</div><h2 style="line-height:1">Programa práctico · ${b.n}</h2></div></div>
 <div class="row" style="margin:6px 0 12px"><button class="btn ${M.hide?'belt':''}" onclick="M.hide=!M.hide;M.rev={};M.done={};memo(${bi})">${M.hide?'🙈 Modo memoria: ON':'🙈 Modo memoria'}</button><button class="btn" onclick="compare(${bi})">📊 Comparar cinturones</button></div>
 <p class="sub" style="font-size:13px;margin-bottom:10px">${M.hide?'Decí en voz alta cada punto antes de tocarlo para ver la respuesta.':'En el examen: tocá cada punto para tildarlo cuando lo hagas.'}</p>
 <div class="plist">${PKEYS.map((k,j)=>{const shown=!M.hide||M.rev[j];return `<div class="pitem" onclick="if(M.hide){M.rev[${j}]=1}else{M.done[${j}]=!M.done[${j}]}memo(${bi})" style="${!M.hide&&M.done[j]?'opacity:.45':''}"><div class="pk"><span class="pn" style="background:${b.c};color:${b.fg}">${!M.hide&&M.done[j]?'✓':(j===8?'★':j+2)}</span>${k}</div><div class="pv ${shown?'':'blur'}">${esc(shown?P[j]:'Tocá para revelar')}</div></div>`}).join('')}</div>
 <p class="sub" style="font-size:12px;margin:8px 2px 14px">Punto 1 es el teórico y el 10 es la defensa personal del cinturón ${b.n}.</p>
 ${Object.keys(M.done).some(k=>M.done[k])?`<button class="btn full" onclick="M.done={};memo(${bi})">↺ Destildar todo</button>`:''}`;
}
function compare(bi){
 setBelt(bi);
 app.innerHTML=`
 <div class="qtop"><button class="x" onclick="memo(${bi})">←</button><div style="flex:1"><div class="sub" style="font-size:12px">Técnico</div><h2 style="line-height:1">Comparar cinturones</h2></div></div>
 <p class="sub" style="font-size:13px;margin-bottom:12px">Cómo evoluciona cada punto del práctico. Ideal para no confundir qué técnica va en cada cinturón.</p>
 ${PKEYS.map((k,j)=>`<details ${j<3?'open':''} style="margin-top:10px"><summary>${k}</summary><div class="cmp">${BELTS.map((b,i)=>`<div class="crow ${i===bi?'me':''}"><span class="cdot" style="background:${b.c}"></span><b>${b.n}</b><span>${esc(PROG[b.k][j])}</span></div>`).join('')}</div></details>`).join('')}`;
}

/* ============ ESTUDIAR (flashcards) ============ */
let F=null;
function study(bi){
 setBelt(bi);const b=BELTS[bi];
 const own=Q.filter(q=>q.b===b.k&&!q.p);
 F={bi,cards:weighted(own,own.length),i:0,known:0,shown:false};drawCard();
}
function drawCard(){
 const b=BELTS[F.bi];
 if(F.i>=F.cards.length){app.innerHTML=`<div class="res"><h2>Repaso terminado</h2><p class="sub" style="margin:8px 0 18px">Te sabías ${F.known} de ${F.cards.length}. Las que no, van a aparecer más seguido en los exámenes.</p></div><div class="row"><button class="btn belt" onclick="startQuiz(${F.bi})">Rendir examen</button><button class="btn" onclick="study(${F.bi})">Repasar otra vez</button></div><button class="btn full" style="margin-top:10px" onclick="home()">Volver</button>`;return}
 const q=F.cards[F.i];
 app.innerHTML=`
 <div class="qtop"><button class="x" onclick="home()">✕</button><div class="qbar"><i style="width:${F.i/F.cards.length*100}%"></i></div><div class="qcount">${F.i+1}/${F.cards.length}</div></div>
 <div class="meta"><span>Estudiar · Cinturón ${b.n}</span><span>Caja ${box(q.id)||'nueva'}</span></div>
 <div class="flash" onclick="F.shown=true;drawCard()">
  <div class="q">${esc(q.q)}</div>
  ${F.shown?`<div class="a">${esc(ansText(q))}<div class="e">${esc(q.e||'')}</div></div>${trickHtml(q)}`:`<div class="tap">Pensá la respuesta y tocá para darla vuelta</div>`}
 </div>
 ${F.shown?`<div class="row" style="margin-top:14px"><button class="btn" style="border-color:var(--bad)" onclick="rate(false)">✗ No la sabía</button><button class="btn" style="border-color:var(--ok)" onclick="rate(true)">✓ La sabía</button></div>`:''}`;
}
function rate(ok){const q=F.cards[F.i];setBox(q.id,ok);if(ok)F.known++;save();F.i++;F.shown=false;drawCard()}

home();
